# =============================================================================
# MenteeConnect Backend — PRODUCTION Profile (application-prod.properties)
# =============================================================================
# Activated by setting environment variable:
#   SPRING_PROFILES_ACTIVE=prod
#
# ALL credentials below MUST be provided via Render environment variables.
# There are NO local fallbacks for secrets on production — the app will fail
# loudly at startup if required env vars are missing, which is what we want.
# =============================================================================

spring.application.name=mentee-connect

# ─────────────────────────────────────────────────────────────────────────────
# DATABASE — MongoDB Atlas (override on Render dashboard)
# ─────────────────────────────────────────────────────────────────────────────
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI}
spring.data.mongodb.auto-index-creation=true
spring.data.mongodb.logging-events=NONE

# ─────────────────────────────────────────────────────────────────────────────
# SERVER
# ─────────────────────────────────────────────────────────────────────────────
# Render injects $PORT dynamically; Dockerfile ENTRYPOINT passes -Dserver.port=${PORT}
server.port=${PORT:8080}
server.servlet.context-path=/api
server.forward-headers-strategy=native
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# Use Render's X-Forwarded-* headers correctly (TLS termination proxy)
server.tomcat.remoteip.protocol-header=X-Forwarded-Proto
server.tomcat.remoteip.remote-ip-header=X-Forwarded-For
server.tomcat.use-relative-redirects=true

# ─────────────────────────────────────────────────────────────────────────────
# JWT — NO fallbacks; must be set via Render env
# ─────────────────────────────────────────────────────────────────────────────
app.jwtSecret=${JWT_SECRET}
app.jwtExpirationMs=${JWT_EXPIRATION_MS:86400000}

# ─────────────────────────────────────────────────────────────────────────────
# CORS — PRODUCTION origins only (localhost explicitly EXCLUDED here)
# ─────────────────────────────────────────────────────────────────────────────
app.cors.allowed-origin-patterns=${APP_CORS_ALLOWED_ORIGIN_PATTERNS:https://menteeconnect.vercel.app,https://*.vercel.app,https://menteeconnect-backend.onrender.com}

# ─────────────────────────────────────────────────────────────────────────────
# FILE UPLOADS
# ─────────────────────────────────────────────────────────────────────────────
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.upload.dir=${APP_UPLOAD_DIR:/tmp/uploads/certificates}

# ─────────────────────────────────────────────────────────────────────────────
# App base URL
# ─────────────────────────────────────────────────────────────────────────────
app.base-url=${APP_BASE_URL:https://menteeconnect-backend.onrender.com}

# ─────────────────────────────────────────────────────────────────────────────
# Swagger / OpenAPI — enabled for prod debugging, but you can disable if needed
# ─────────────────────────────────────────────────────────────────────────────
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:true}

# ─────────────────────────────────────────────────────────────────────────────
# Request handling
# ─────────────────────────────────────────────────────────────────────────────
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false
spring.mvc.pathmatch.matching-strategy=ant_path_matcher

# ─────────────────────────────────────────────────────────────────────────────
# Performance & Render free-tier optimizations
# ─────────────────────────────────────────────────────────────────────────────
# Lazy init reduces cold-start memory footprint (important for Render 512MB free tier)
spring.main.lazy-initialization=true
spring.main.allow-bean-definition-overriding=false
spring.main.banner-mode=off

# GZIP Compression — reduces payload size over the wire significantly
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/xml,text/plain,application/javascript,text/css,image/svg+xml,application/font-woff2
server.compression.min-response-size=1024
server.compression.vary=Accept-Encoding

# Connection pool tuning for MongoDB (avoid too many connections on small instances)
spring.data.mongodb.mongodb-client-settings.max-connection-idle-time=60s
spring.data.mongodb.mongodb-client-settings.max-connection-life-time=300s

# Tomcat thread tuning for Render free tier (single core)
server.tomcat.threads.max=50
server.tomcat.threads.min-spare=5
server.tomcat.max-connections=100
server.tomcat.accept-count=50

# ─────────────────────────────────────────────────────────────────────────────
# LOGGING — Prod defaults: WARN for framework, INFO for app
# ─────────────────────────────────────────────────────────────────────────────
logging.level.root=WARN
logging.level.org.springframework.security=WARN
logging.level.org.springframework.web=WARN
logging.level.org.springframework.data.mongodb=WARN
logging.level.com.mahesh.mentee_connect=${LOG_LEVEL_APP:INFO}
logging.level.com.mahesh.mentee_connect.security.jwt=${LOG_LEVEL_JWT:WARN}
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

# Disable ANSI color in Render logs (they just add noise to log drains)
spring.output.ansi.enabled=never

# ─────────────────────────────────────────────────────────────────────────────
# Caching — local in-memory cache for low-memory footprint
# ─────────────────────────────────────────────────────────────────────────────
# Short TTL so stale data does not linger, but we benefit from in-request deduplication
spring.cache.type=simple
spring.cache.cache-names=mentors,students,batches,analytics,users,notifications
